<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { r: 3.5; opacity: 0.5; }
      50% { r: 5.5; opacity: 1; }
    }

    .bg-orb-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-orb-2 { animation: pulseGlow 10s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .float-card-1 { animation: floatPill1 6s ease-in-out infinite; }
    .float-card-2 { animation: floatPill2 7s ease-in-out infinite 1s; }
    .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .tech-line { stroke: url(#primaryGrad); stroke-width: 2; stroke-dasharray: 6 6; animation: dashLine 25s linear infinite; }
    .pulse-node { animation: pulseDot 3s ease-in-out infinite; }
  </style>

  <!-- Deep Backdrop -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Background -->
  <circle class="bg-orb-1" cx="220" cy="110" r="140" fill="#6366f1" opacity="0.35" filter="url(#softGlow)" />
  <circle class="bg-orb-2" cx="980" cy="280" r="160" fill="#ec4899" opacity="0.3" filter="url(#softGlow)" />
  <circle cx="600" cy="400" r="180" fill="#06b6d4" opacity="0.18" filter="url(#softGlow)" />

  <!-- Technical Grid Matrix (Background) -->
  <g opacity="0.8">
    <line x1="80" y1="0" x2="80" y2="420" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="420" class="grid-line" />
    <line x1="320" y1="0" x2="320" y2="420" class="grid-line" />
    <line x1="440" y1="0" x2="440" y2="420" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="420" class="grid-line" />
    <line x1="680" y1="0" x2="680" y2="420" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="420" class="grid-line" />
    <line x1="920" y1="0" x2="920" y2="420" class="grid-line" />
    <line x1="1040" y1="0" x2="1040" y2="420" class="grid-line" />

    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
  </g>

  <!-- Dynamic Circuit / Portfolio Data Flow Path (Behind Title) -->
  <path d="M 80,310 C 260,310 320,180 500,180 C 680,180 740,290 920,290 C 1040,290 1100,230 1150,230" fill="none" class="tech-line" opacity="0.45" />

  <!-- Animated Data Flow Nodes (Well to sides to not occlude typography) -->
  <circle class="pulse-node" cx="140" cy="310" r="4" fill="#6366f1" />
  <circle class="pulse-node" cx="320" cy="180" r="4" fill="#a855f7" />
  <circle class="pulse-node" cx="880" cy="290" r="4" fill="#ec4899" />
  <circle class="pulse-node" cx="1100" cy="230" r="4" fill="#06b6d4" />

  <!-- Subtly Animated Ambient Feature Pills (Positioned at Top/Bottom Corners) -->
  <g class="float-card-1" transform="translate(90, 48)">
    <rect width="180" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">STRATEGY &amp; OKRS</text>
  </g>

  <g class="float-card-2" transform="translate(930, 48)">
    <rect width="180" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#06b6d4" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">FINOPS &amp; VALUE</text>
  </g>

  <!-- MAIN FOREGROUND TYPOGRAPHY (Crystal Clear & Prominent) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="475" y="65" width="250" height="30" rx="15" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.2" />
    <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="2">CURATED AWESOME LIST</text>

    <!-- Main Title with Gradient fill -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Digital Portfolio Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Strategic Portfolio Management (SPM) • Enterprise Agile (EAP) • Open-Source Systems
    </text>
  </g>

  <!-- Bottom Core Capability Pills Bar (Foreground, Clean) -->
  <g transform="translate(250, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="150" height="38" rx="10" fill="#1e293b" stroke="rgba(99,102,241,0.3)" stroke-width="1" />
      <text x="75" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">📊 SPM &amp; PPM</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(180, 0)">
      <rect width="160" height="38" rx="10" fill="#1e293b" stroke="rgba(168,85,247,0.3)" stroke-width="1" />
      <text x="80" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">⚡ Agile &amp; SAFe</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(365, 0)">
      <rect width="165" height="38" rx="10" fill="#1e293b" stroke="rgba(6,182,212,0.3)" stroke-width="1" />
      <text x="82" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">💰 FinOps / ITFM</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(555, 0)">
      <rect width="145" height="38" rx="10" fill="#1e293b" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
      <text x="72" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🔓 Open Source</text>
    </g>
  </g>

  <!-- Elegant Bottom Gradient Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
